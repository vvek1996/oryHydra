apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-config
  namespace: default
data:
  traefik.yml: |
    entryPoints:
      web:
        address: ":8080"
      websecure:
        address: ":8443"

    providers:
      file:
        filename: "/etc/traefik/routes.yml"
        watch: true

    api:
      dashboard: true

    log:
      level: INFO

    tracing:
      jaeger:
        collector:
          endpoint: "http://jaeger.default.svc.cluster.local:14268/api/traces"

  routes.yml: |
    http:
      routers:
        # 1. Route /.ory/kratos to Kratos Public API (4433)
        kratos-router:
          rule: "PathPrefix(`/.ory/kratos`)"
          entryPoints:
            - websecure
          service: kratos-service
          middlewares:
            - kratos-strip
          tls: {}

        kratos-http-router:
          rule: "PathPrefix(`/.ory/kratos`)"
          entryPoints:
            - web
          service: kratos-service
          middlewares:
            - redirect-to-https

        # 2. Route /.ory/hydra to Hydra Public API (4444)
        hydra-router:
          rule: "PathPrefix(`/.ory/hydra`)"
          entryPoints:
            - websecure
          service: hydra-service
          middlewares:
            - hydra-strip
          tls: {}

        hydra-http-router:
          rule: "PathPrefix(`/.ory/hydra`)"
          entryPoints:
            - web
          service: hydra-service
          middlewares:
            - redirect-to-https

        # 3. Route /api to Go Backend (4000)
        backend-router:
          rule: "PathPrefix(`/api`)"
          entryPoints:
            - websecure
          service: backend-service
          middlewares:
            - api-strip
          priority: 50
          tls: {}

        backend-http-router:
          rule: "PathPrefix(`/api`)"
          entryPoints:
            - web
          service: backend-service
          middlewares:
            - redirect-to-https
          priority: 50

        # 4. Route / to React Frontend (3000)
        frontend-router:
          rule: "PathPrefix(`/`)"
          entryPoints:
            - websecure
          service: frontend-service
          tls: {}

        frontend-http-router:
          rule: "PathPrefix(`/`)"
          entryPoints:
            - web
          service: frontend-service
          middlewares:
            - redirect-to-https

        # 5. Route HTTPS traffic to Zot Registry (5000) with auto-generated TLS certificate
        zot-router:
          rule: "Host(`zot.localhost`)"
          entryPoints:
            - websecure
          service: zot-service
          tls: {}

        # 6. Route HTTPS traffic to Jaeger UI (16686)
        jaeger-router:
          rule: "Host(`jaeger.localhost`)"
          entryPoints:
            - websecure
          service: jaeger-service
          tls: {}

        jaeger-http-router:
          rule: "Host(`jaeger.localhost`)"
          entryPoints:
            - web
          service: jaeger-service
          middlewares:
            - redirect-to-https

      services:
        kratos-service:
          loadBalancer:
            servers:
              - url: "http://kratos-public.default.svc.cluster.local:4433"
        hydra-service:
          loadBalancer:
            servers:
              - url: "http://hydra-public.default.svc.cluster.local:4444"
        backend-service:
          loadBalancer:
            servers:
              - url: "http://hydra-backend-go.default.svc.cluster.local:4000"
        frontend-service:
          loadBalancer:
            servers:
              - url: "http://hydra-client.default.svc.cluster.local:3000"
        zot-service:
          loadBalancer:
            servers:
              - url: "http://zot-service.zot.svc.cluster.local:5000"
        jaeger-service:
          loadBalancer:
            servers:
              - url: "http://jaeger.default.svc.cluster.local:16686"

      middlewares:
        redirect-to-https:
          redirectScheme:
            scheme: https
            port: "8443"
            permanent: true
        kratos-strip:
          stripPrefix:
            prefixes:
              - "/.ory/kratos"
        hydra-strip:
          stripPrefix:
            prefixes:
              - "/.ory/hydra"
        api-strip:
          stripPrefix:
            prefixes:
              - "/api"
    tls:
      certificates:
        - certFile: /etc/traefik/certs/tls.crt
          keyFile: /etc/traefik/certs/tls.key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: default
  labels:
    app: traefik
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      containers:
        - name: traefik
          image: traefik:v2.10
          ports:
            - containerPort: 8080
              name: web
            - containerPort: 8443
              name: websecure
          volumeMounts:
            - name: traefik-config-volume
              mountPath: /etc/traefik
            - name: cert-volume
              mountPath: /etc/traefik/certs
      volumes:
        - name: traefik-config-volume
          configMap:
            name: traefik-config
        - name: cert-volume
          secret:
            secretName: traefik-tls-cert
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: default
spec:
  type: LoadBalancer
  ports:
    - port: 8080
      targetPort: 8080
      name: web
    - port: 8443
      targetPort: 8443
      name: websecure
  selector:
    app: traefik
