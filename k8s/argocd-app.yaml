apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-server-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/write-back-method: argocd
    argocd-image-updater.argoproj.io/image-list: go-server=ghcr.io/vvek1996/oryhydra
    argocd-image-updater.argoproj.io/go-server.update-strategy: latest
spec:
  project: default
  source:
    repoURL: 'https://github.com/vvek1996/oryHydra.git'
    targetRevision: argocd-deployment
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
