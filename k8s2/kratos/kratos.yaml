apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-config
  namespace: default
data:
  kratos.yml: |
    dsn: postgres://ory:secret@postgres:5432/kratos?sslmode=disable

    serve:
      public:
        base_url: http://localhost:8080/.ory/kratos/
        cors:
          enabled: true
          allowed_origins:
            - http://localhost:3000
            - http://localhost:8080
            - http://localhost
          allow_credentials: true
          allowed_methods:
            - GET
            - POST
            - PUT
            - DELETE
            - PATCH
          allowed_headers:
            - Authorization
            - Content-Type
            - Cookie
      admin:
        base_url: http://kratos-admin:4434/

    selfservice:
      default_browser_return_url: http://localhost:8080/
      allowed_return_urls:
        - http://localhost:3000/
        - http://localhost:4444/
        - http://localhost:8080/

      methods:
        password:
          enabled: true

      flows:
        login:
          ui_url: http://localhost:8080/login
        registration:
          ui_url: http://localhost:8080/register

    identity:
      default_schema_id: default
      schemas:
        - id: default
          url: file:///etc/kratos/identity.schema.json

    log:
      level: debug

  identity.schema.json: |
    {
      "$id": "https://schemas.ory.sh/presets/kratos/identity.email.schema.json",
      "type": "object",
      "properties": {
        "traits": {
          "type": "object",
          "properties": {
            "email": {
              "type": "string",
              "format": "email",
              "ory.sh/kratos": {
                "credentials": {
                  "password": {
                    "identifier": true
                  }
                }
              }
            }
          },
          "required": ["email"]
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
  namespace: default
  labels:
    app: kratos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kratos
  template:
    metadata:
      labels:
        app: kratos
    spec:
      initContainers:
        - name: kratos-migrate
          image: oryd/kratos:v1.3.0
          command: ["kratos", "migrate", "sql", "-e", "-c", "/etc/kratos/kratos.yml", "-y"]
          volumeMounts:
            - name: kratos-config-volume
              mountPath: /etc/kratos
      containers:
        - name: kratos
          image: oryd/kratos:v1.3.0
          command: ["kratos", "serve", "-c", "/etc/kratos/kratos.yml", "--dev"]
          ports:
            - containerPort: 4433
              name: public
            - containerPort: 4434
              name: admin
          env:
            - name: KRATOS_PUBLIC_CORS_ENABLED
              value: "true"
            - name: KRATOS_PUBLIC_CORS_ALLOWED_ORIGINS
              value: "http://localhost:3000,http://localhost:8080,http://localhost"
            - name: SERVE_PUBLIC_CORS_ENABLED
              value: "true"
            - name: SERVE_PUBLIC_CORS_ALLOWED_ORIGINS
              value: "http://localhost:3000,http://localhost:8080,http://localhost"
            - name: TRACING_PROVIDER
              value: "otel"
            - name: TRACING_PROVIDERS_OTLP_SERVER_URL
              value: "jaeger.default.svc.cluster.local:4317"
            - name: TRACING_PROVIDERS_OTLP_INSECURE
              value: "true"
          volumeMounts:
            - name: kratos-config-volume
              mountPath: /etc/kratos
      volumes:
        - name: kratos-config-volume
          configMap:
            name: kratos-config
---
apiVersion: v1
kind: Service
metadata:
  name: kratos-public
  namespace: default
spec:
  ports:
    - port: 4433
      targetPort: 4433
      name: public
  selector:
    app: kratos
---
apiVersion: v1
kind: Service
metadata:
  name: kratos-admin
  namespace: default
spec:
  ports:
    - port: 4434
      targetPort: 4434
      name: admin
  selector:
    app: kratos
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-user-seeding
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: seeder
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kratos Admin endpoint..."
              until curl -s http://kratos-admin:4434/admin/identities > /dev/null; do
                sleep 2
              done
              echo "Kratos Admin is ready."
              
              if curl -s http://kratos-admin:4434/admin/identities | grep -q "kpvivek196@gmail.com"; then
                echo "Default user kpvivek196@gmail.com already exists."
              else
                echo "Creating default user kpvivek196@gmail.com..."
                curl -s -X POST http://kratos-admin:4434/admin/identities \
                  -H "Content-Type: application/json" \
                  -d '{"schema_id":"default","traits":{"email":"kpvivek196@gmail.com"},"credentials":{"password":{"config":{"password":"secretpassword"}}}}'
                echo "Default user created successfully."
              fi
      restartPolicy: OnFailure
  backoffLimit: 4
