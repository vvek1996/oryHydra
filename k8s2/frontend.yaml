apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydra-client
  namespace: default
  labels:
    app: hydra-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hydra-client
  template:
    metadata:
      labels:
        app: hydra-client
    spec:
      containers:
        - name: hydra-client
          image: hydra-client:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
---
apiVersion: v1
kind: Service
metadata:
  name: hydra-client
  namespace: default
spec:
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app: hydra-client
